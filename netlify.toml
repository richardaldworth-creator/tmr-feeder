# Netlify settings for Inspection Notes. The app is plain static files with no build step.
[build]
  base = "inspection"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# The service worker and page must be re-checked on each visit so updates reach the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
