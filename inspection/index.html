<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#013C29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspection">
<title>Inspection Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --dark:#013C29;      /* body headings and primary text */
  --green:#015037;     /* section headings, rules, table header shading */
  --light:#5A8D7C;     /* secondary text, sub labels, light rules */
  --pale:#E1E8CE;      /* pale page background */
  --white:#ffffff;
  --line:#c9d3b4;
  --red:#9b2c1f;
  --amber:#a8641a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--pale);color:var(--dark);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--dark);color:var(--pale);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:52px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
header button{background:none;border:0;color:var(--pale);font-size:15px;padding:6px 4px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 16px 90px}
.card{background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(1,60,41,.08)}
h2{font-size:15px;color:var(--green);margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--green);display:flex;align-items:center;gap:8px}
h2 .grow{flex:1}
h3{font-size:14px;color:var(--green);margin:14px 0 6px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;color:var(--light);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
input,select,textarea{font:inherit;color:var(--dark);width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfcf8}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--light);border-color:var(--light)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--green);color:var(--white);border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--white);color:var(--green);border:1.5px solid var(--green)}
.btn.ghost{background:none;color:var(--light);padding:8px}
.btn.danger{background:var(--red)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:8px}
.btn.block{display:flex;width:100%;margin-bottom:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btns>.btn{flex:1 1 140px}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eef1e6;cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item .thumb{width:56px;height:56px;border-radius:8px;background:var(--pale) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:var(--light);font-size:12px;font-weight:700}
.list-item .txt{flex:1;min-width:0}
.list-item .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .t2{font-size:13px;color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--light);font-size:20px}
.muted{color:var(--light);font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--pale);color:var(--green)}
.pill.warn{background:#f6e3c9;color:var(--amber)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:8px;background:var(--pale) center/cover no-repeat;cursor:pointer;overflow:hidden}
.photos .ph span{position:absolute;left:0;right:0;bottom:0;background:rgba(1,60,41,.75);color:#fff;font-size:11px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.meas{width:100%;border-collapse:collapse;font-size:14px}
table.meas th{font-size:11px;color:var(--light);text-align:left;font-weight:700;text-transform:uppercase;padding:4px 3px}
table.meas td{padding:3px}
table.meas input{padding:8px 6px}
table.meas td.area{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:74px}
table.meas td.x{width:34px}
.total{display:flex;justify-content:space-between;font-weight:700;padding:8px 3px 0;border-top:2px solid var(--green);margin-top:6px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:10px}
.fab .btn{box-shadow:0 4px 14px rgba(1,60,41,.35);border-radius:28px;padding:14px 18px}
.banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px;background:#f6e3c9;color:#5c3608}
.banner.ok{background:#dcebd9;color:var(--dark)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--dark);color:var(--pale);padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.viewer{background:#000;margin:-12px -16px 12px;text-align:center}
.viewer img{max-width:100%;max-height:70vh;display:block;margin:0 auto}
details>summary{cursor:pointer;color:var(--green);font-weight:600;padding:4px 0;list-style:none}
details>summary::before{content:"▸ ";}
details[open]>summary::before{content:"▾ ";}
.hidden{display:none!important}
.saving{font-size:12px;color:var(--pale);opacity:.8}
.preview{white-space:pre-wrap;font-size:14px;background:#fbfcf8;border:1px solid var(--line);border-radius:8px;padding:10px}
.overlay{position:fixed;inset:0;background:rgba(1,60,41,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.fld{display:flex;gap:6px;align-items:flex-start}
.fld>input,.fld>textarea{flex:1;min-width:0}
.mic{flex:none;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--light);background:var(--white);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mic.on{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
.dictating{outline:2px solid var(--red)!important;border-color:var(--red)!important}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(155,44,31,.5)}50%{box-shadow:0 0 0 8px rgba(155,44,31,0)}}
</style>
</head>
<body>
<header>
  <button id="backBtn" class="hidden" aria-label="Back">‹ Back</button>
  <h1 id="title">Inspection Notes</h1>
  <span id="saving" class="saving"></span>
  <button id="menuBtn" aria-label="Settings">⚙︎</button>
</header>
<main id="app"></main>
<div id="fab" class="fab"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="libInput" accept="image/*" multiple class="hidden">
<input type="file" id="importInput" accept=".zip,.json,application/zip,application/json" class="hidden">
<script src="lib/jszip.min.js"></script>
<script src="lib/docx.umd.js"></script>
<script src="voice.js"></script>
<script src="gallery.js"></script>
<script src="app.js"></script>
</body>
</html>
